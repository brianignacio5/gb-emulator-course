<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GB Emulator Course</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #1a1f16;
        --panel: #2a3324;
        --ink: #c8d4b0;
        --accent: #8fbc5a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        background:
          radial-gradient(ellipse at 20% 0%, #3a4a2a 0%, transparent 50%),
          var(--bg);
        color: var(--ink);
      }
      main {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        align-items: center;
        padding: 1.5rem;
      }
      h1 {
        margin: 0;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--accent);
      }
      canvas {
        width: 480px;
        height: 432px;
        image-rendering: pixelated;
        background: #0f140c;
        border: 3px solid #4a5c38;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
        background: var(--panel);
        padding: 0.75rem 1rem;
        border-radius: 4px;
      }
      button, label.file {
        background: var(--accent);
        color: #1a1f16;
        border: none;
        padding: 0.45rem 0.85rem;
        font-weight: 600;
        cursor: pointer;
        border-radius: 2px;
      }
      label.file input { display: none; }
      .hint { font-size: 0.85rem; opacity: 0.8; max-width: 28rem; text-align: center; }
    </style>
  </head>
  <body>
    <main>
      <h1>GB EMU</h1>
      <canvas id="screen" width="160" height="144" aria-label="Game Boy screen"></canvas>
      <div class="controls">
        <label class="file">Load ROM<input id="rom" type="file" accept=".gb,.gbc,.bin" /></label>
        <button id="mute" type="button">Mute</button>
      </div>
      <p class="hint">Arrow keys = D-pad · Z = A · X = B · Enter = Start · Shift = Select</p>
    </main>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
